server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: optional:nacos:gateway.yaml

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
    gateway:
      global-filter:
        auth:
          white-list:
            - /sse/**
            - /users
      routes:
        # java用户服务路由
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**,/api/live/**,/api/danmaku/**
          filters:
            - StripPrefix=1
          metadata:
            # SSE 长连接不能被网关超时切断
            response-timeout: -1
            connect-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: "*"
