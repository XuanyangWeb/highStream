syntax = "proto3";
package live.v1;
option java_package = "com.highstream.proto.live.v1";
option java_multiple_files = true;
option java_outer_classname = "LiveProto";
option go_package = "highstream/live-service/pb/live/v1;livev1";

message Room {
  int64 id = 1;
  string title = 2;
  int64 owner_id = 3;
  int32 status = 4;      // 0=未开播 1=直播中 2=已结束
  string play_url = 5;
}

message CreateRoomRequest {
  int64 owner_id = 1;
  string title = 2;
}
message CreateRoomResponse { Room room = 1; }

message ListRoomsRequest {
  int32 page = 1;
  int32 page_size = 2;
}
message ListRoomsResponse {
  repeated Room rooms = 1;
  int32 total = 2;
}

message StartLiveRequest {
  int64 room_id = 1;
  int64 owner_id = 2;
}
message StartLiveResponse { Room room = 1; }

message StopLiveRequest { int64 room_id = 1; }
message StopLiveResponse { Room room = 1; }

service LiveService {
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  rpc StartLive(StartLiveRequest) returns (StartLiveResponse);
  rpc StopLive(StopLiveRequest) returns (StopLiveResponse);
}
